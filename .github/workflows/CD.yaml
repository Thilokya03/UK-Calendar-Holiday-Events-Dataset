name: UK Dataset Publish

on:

  # Start CD only after the CI workflow finishes.
  workflow_run:
    workflows:
      - "UK Dataset Pipeline"

    types:
      - completed

    branches:
      - main


# CD needs:
#
# actions:read
#   -> download the artifact from the CI workflow
#
# contents:write
#   -> create GitHub tags and releases
permissions:
  actions: read
  contents: write


# Prevent two releases from being created simultaneously.
concurrency:
  group: uk-dataset-publish
  cancel-in-progress: false


jobs:

  publish:

    name: Check Changes and Publish Dataset

    # ---------------------------------------------------------
    # Publish only when:
    #
    # 1. CI succeeded
    # 2. CI was NOT a pull request run
    # ---------------------------------------------------------
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request'

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


    steps:

      # =========================================================
      # 1. Download the artifact generated by the exact CI run
      # =========================================================
      - name: Download validated CI artifact
        uses: actions/download-artifact@v8
        with:
          name: uk-calendar-economic-datasets

          path: candidate

          repository: ${{ github.repository }}

          run-id: ${{ github.event.workflow_run.id }}

          github-token: ${{ secrets.GITHUB_TOKEN }}


      # =========================================================
      # 2. Verify downloaded artifact
      # =========================================================
      - name: Verify downloaded artifact
        run: |
          echo "Downloaded files:"
          find candidate -type f -maxdepth 2 -print

          if [ ! -f "candidate/full_calendar_features.csv" ]; then
            echo "ERROR: full_calendar_features.csv is missing."
            exit 1
          fi

          if [ ! -f "candidate/uk_economic_features_daily.csv" ]; then
            echo "ERROR: uk_economic_features_daily.csv is missing."
            exit 1
          fi

          if [ ! -f "candidate/SHA256SUMS.txt" ]; then
            echo "ERROR: SHA256SUMS.txt is missing."
            exit 1
          fi


      # =========================================================
      # 3. Verify artifact integrity
      # =========================================================
      - name: Verify SHA256 checksums
        working-directory: candidate
        run: |
          sha256sum -c SHA256SUMS.txt


      # =========================================================
      # 4. Find latest semantic-version dataset release
      #
      # Examples:
      #
      # v1.0.0
      # v1.0.1
      # v1.0.2
      #
      # =========================================================
      - name: Find latest dataset version
        id: latest
        shell: bash
        run: |
          LATEST_TAG="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json tagName,isDraft,isPrerelease \
              --jq '.[] |
                    select(.isDraft == false and .isPrerelease == false) |
                    .tagName' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          if [ -z "$LATEST_TAG" ]; then

            echo "No previous dataset release exists."
            echo "This will be the first release."

          else

            echo "Latest dataset release: $LATEST_TAG"

          fi

          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 5. Download CSV files from previous release
      # =========================================================
      - name: Download previous dataset version
        if: steps.latest.outputs.tag != ''
        shell: bash
        run: |
          mkdir -p previous

          LATEST_TAG="${{ steps.latest.outputs.tag }}"

          echo "Downloading previous datasets from $LATEST_TAG"

          gh release download "$LATEST_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir previous \
            --pattern "full_calendar_features.csv"

          gh release download "$LATEST_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir previous \
            --pattern "uk_economic_features_daily.csv"

          echo ""
          echo "Previous release files:"

          ls -lh previous/


      # =========================================================
      # 6. Verify previous release files
      # =========================================================
      - name: Verify previous release datasets
        if: steps.latest.outputs.tag != ''
        run: |
          if [ ! -f "previous/full_calendar_features.csv" ]; then
            echo "ERROR: Previous release does not contain full_calendar_features.csv."
            exit 1
          fi

          if [ ! -f "previous/uk_economic_features_daily.csv" ]; then
            echo "ERROR: Previous release does not contain uk_economic_features_daily.csv."
            exit 1
          fi


      # =========================================================
      # 7. Compare NEW CSVs with PREVIOUS RELEASE
      # =========================================================
      - name: Check whether datasets changed
        id: changes
        shell: bash
        run: |
          : > changed_files.txt

          LATEST_TAG="${{ steps.latest.outputs.tag }}"

          # ---------------------------------------------------
          # No previous release means this is the first release.
          # ---------------------------------------------------
          if [ -z "$LATEST_TAG" ]; then

            echo "First dataset release."

            echo "full_calendar_features.csv" \
              >> changed_files.txt

            echo "uk_economic_features_daily.csv" \
              >> changed_files.txt

            echo "changed=true" >> "$GITHUB_OUTPUT"

            exit 0
          fi


          # ---------------------------------------------------
          # Compare Calendar Dataset
          # ---------------------------------------------------
          if cmp -s \
            candidate/full_calendar_features.csv \
            previous/full_calendar_features.csv
          then

            echo "Calendar dataset: NO CHANGE"

          else

            echo "Calendar dataset: CHANGED"

            echo "full_calendar_features.csv" \
              >> changed_files.txt

          fi


          # ---------------------------------------------------
          # Compare Economic Dataset
          # ---------------------------------------------------
          if cmp -s \
            candidate/uk_economic_features_daily.csv \
            previous/uk_economic_features_daily.csv
          then

            echo "Economic dataset: NO CHANGE"

          else

            echo "Economic dataset: CHANGED"

            echo "uk_economic_features_daily.csv" \
              >> changed_files.txt

          fi


          # ---------------------------------------------------
          # Final decision
          # ---------------------------------------------------
          if [ -s changed_files.txt ]; then

            echo ""
            echo "Dataset changes detected."

            echo "changed=true" >> "$GITHUB_OUTPUT"

          else

            echo ""
            echo "No dataset changes detected."

            echo "changed=false" >> "$GITHUB_OUTPUT"

          fi


      # =========================================================
      # 8. Stop publishing when nothing changed
      # =========================================================
      - name: No release required
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "=========================================="
          echo "Datasets are identical to latest release."
          echo "No new version will be created."
          echo "=========================================="

          {
            echo "# Dataset Release Check"
            echo ""
            echo "No dataset changes were detected."
            echo ""
            echo "No GitHub Release was created."
          } >> "$GITHUB_STEP_SUMMARY"


      # =========================================================
      # 9. Calculate next dataset version
      #
      # Automatic data updates = PATCH
      #
      # v1.0.0
      #    ↓
      # v1.0.1
      #    ↓
      # v1.0.2
      #
      # =========================================================
      - name: Calculate next version
        id: version
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          LATEST_TAG="${{ steps.latest.outputs.tag }}"

          if [ -z "$LATEST_TAG" ]; then

            NEW_VERSION="v1.0.0"

          else

            VERSION="${LATEST_TAG#v}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            PATCH=$((PATCH + 1))

            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          fi

          echo "Previous version: ${LATEST_TAG:-None}"
          echo "New version: $NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 10. Build release package
      # =========================================================
      - name: Create dataset package
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          tar -czf \
            "uk-calendar-economic-datasets-${VERSION}.tar.gz" \
            -C candidate \
            full_calendar_features.csv \
            uk_economic_features_daily.csv \
            SHA256SUMS.txt

          ls -lh \
            "uk-calendar-economic-datasets-${VERSION}.tar.gz"


      # =========================================================
      # 11. Generate release notes
      # =========================================================
      - name: Generate release notes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREVIOUS_VERSION="${{ steps.latest.outputs.tag }}"
          SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
          CI_RUN_ID="${{ github.event.workflow_run.id }}"

          {
            echo "# UK Calendar & Economic Dataset ${VERSION}"
            echo ""
            echo "Automated dataset release."
            echo ""
            echo "## Changed Datasets"
            echo ""

            while IFS= read -r file
            do

              if [ -n "$file" ]; then
                echo "- \`$file\`"
              fi

            done < changed_files.txt

            echo ""
            echo "## Included Datasets"
            echo ""
            echo "- \`full_calendar_features.csv\`"
            echo "- \`uk_economic_features_daily.csv\`"

            echo ""
            echo "## Integrity"
            echo ""
            echo "SHA-256 checksums are available in:"
            echo ""
            echo "- \`SHA256SUMS.txt\`"

            echo ""
            echo "## Source"
            echo ""
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- CI workflow run: \`${CI_RUN_ID}\`"

            if [ -n "$PREVIOUS_VERSION" ]; then

              echo ""
              echo "## Previous Version"
              echo ""
              echo "\`${PREVIOUS_VERSION}\`"

            fi

          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md


      # =========================================================
      # 12. Create GitHub Release
      #
      # gh release create automatically creates the Git tag
      # when the tag does not already exist.
      # =========================================================
      - name: Publish GitHub Release
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "UK Dataset $VERSION" \
            --notes-file RELEASE_NOTES.md \
            candidate/full_calendar_features.csv \
            candidate/uk_economic_features_daily.csv \
            candidate/SHA256SUMS.txt \
            "uk-calendar-economic-datasets-${VERSION}.tar.gz"


      # =========================================================
      # 13. GitHub Actions summary
      # =========================================================
      - name: Add release summary
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          {
            echo "# Dataset Published"
            echo ""
            echo "**Version:** \`${VERSION}\`"
            echo ""
            echo "## Released Files"
            echo ""
            echo "- full_calendar_features.csv"
            echo "- uk_economic_features_daily.csv"
            echo "- SHA256SUMS.txt"
            echo "- uk-calendar-economic-datasets-${VERSION}.tar.gz"
            echo ""
            echo "## Changed Files"
            echo ""

            while IFS= read -r file
            do
              echo "- $file"
            done < changed_files.txt

          } >> "$GITHUB_STEP_SUMMARY"