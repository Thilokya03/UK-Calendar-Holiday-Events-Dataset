name: UK Dataset Pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

  schedule:
    # Every Saturday at 00:00 UTC
    # Saturday at 05:30 AM in Sri Lanka
    - cron: "0 0 * * 6"

  workflow_dispatch:

jobs:
  validate-code:
    name: Generate and Validate Datasets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate basic calendar
        run: python src/calendar/basic_calender.py

      - name: Collect source data
        run: |
          python src/collectors/event_pipeline.py
          python src/collectors/extract_economic_data.py
          python src/collectors/historical_holiday_collectore.py
          python src/collectors/holiday_collectore.py

      - name: Merge calendar and economic features
        run: |
          python src/merge/merge_calendar_features.py
          python src/merge/merge_economic_features.py

      - name: Run tests and validate datasets
        run: python -m pytest tests/ -v

      - name: Upload generated datasets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uk-calendar-economic-datasets
          path: data/processed/
          if-no-files-found: error
          retention-days: 30